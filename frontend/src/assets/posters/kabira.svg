<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#0c0a09" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#050505" stop-opacity="1" />
    </linearGradient>

    <radialGradient id="stageGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#eab308" stop-opacity="0.15" />
      <stop offset="100%" stop-color="transparent" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="transparent" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Deep Obsidian Background -->
  <rect width="600" height="800" fill="#09090b" />
  <rect width="600" height="800" fill="url(#bgGrad)" />
  <circle cx="300" cy="280" r="340" fill="url(#stageGlow)" />

  <!-- Vinyl Record Motif Behind -->
  <g opacity="0.35">
    <circle cx="300" cy="360" r="190" fill="none" stroke="#262626" stroke-width="1.5" />
    <circle cx="300" cy="360" r="165" fill="none" stroke="#1c1917" stroke-width="1.5" />
    <circle cx="300" cy="360" r="140" fill="none" stroke="#292524" stroke-width="1.5" />
    <circle cx="300" cy="360" r="115" fill="none" stroke="#1c1917" stroke-width="1.5" />
    <circle cx="300" cy="360" r="90" fill="none" stroke="#44403c" stroke-width="2" />
    <circle cx="300" cy="360" r="30" fill="#f97316" opacity="0.6" />
    <circle cx="300" cy="360" r="8" fill="#ffffff" />
  </g>

  <!-- Framing Border -->
  <rect x="20" y="20" width="560" height="760" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5" />
  <rect x="28" y="28" width="544" height="744" rx="12" fill="none" stroke="#f97316" stroke-opacity="0.3" stroke-width="1" />

  <!-- Top Badges -->
  <rect x="45" y="45" width="130" height="26" rx="13" fill="#000000" fill-opacity="0.75" stroke="#f97316" stroke-opacity="0.6" stroke-width="1" />
  <text x="110" y="62" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#f97316" text-anchor="middle" letter-spacing="1.5">OFFICIAL 4K</text>

  <rect x="425" y="45" width="130" height="26" rx="13" fill="#eab308" fill-opacity="0.35" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1" />
  <text x="490" y="62" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">ORIGINAL</text>

  <!-- Film Banner -->
  <text x="300" y="145" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#fb923c" text-anchor="middle" letter-spacing="5" opacity="0.95">YEH JAWAANI HAI DEEWANI</text>
  <line x1="140" y1="165" x2="460" y2="165" stroke="url(#accentLine)" stroke-width="2" />

  <!-- Tagline -->
  <text x="300" y="195" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#d6d3d1" text-anchor="middle" letter-spacing="3" opacity="0.8">FOR THE RESTLESS SOUL &amp; THE FREE SPIRIT</text>

  <!-- Big Central Song Title -->
  <g filter="url(#shadow)">
    <text x="300" y="325" font-family="Impact, 'Arial Black', sans-serif" font-size="52" font-weight="900" fill="url(#goldText)" text-anchor="middle" letter-spacing="4">KABIRA</text>
    <text x="300" y="380" font-family="system-ui, 'Noto Sans Devanagari', sans-serif" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle" opacity="0.95">रे कबीरा मान जा</text>
  </g>

  <!-- Audio Equalizer Wave Graphic -->
  <g transform="translate(180, 420)" fill="#f97316" opacity="0.85">
    <rect x="0" y="15" width="4" height="25" rx="2" />
    <rect x="10" y="5" width="4" height="45" rx="2" />
    <rect x="20" y="20" width="4" height="15" rx="2" />
    <rect x="30" y="0" width="4" height="55" rx="2" />
    <rect x="40" y="10" width="4" height="35" rx="2" />
    <rect x="50" y="18" width="4" height="20" rx="2" />
    <rect x="60" y="8" width="4" height="40" rx="2" />
    <rect x="70" y="0" width="4" height="55" rx="2" fill="#ffffff" />
    <rect x="80" y="4" width="4" height="48" rx="2" fill="#ffffff" />
    <rect x="90" y="14" width="4" height="30" rx="2" fill="#ffffff" />
    <rect x="100" y="2" width="4" height="52" rx="2" fill="#ffffff" />
    <rect x="110" y="12" width="4" height="32" rx="2" />
    <rect x="120" y="6" width="4" height="44" rx="2" />
    <rect x="130" y="22" width="4" height="12" rx="2" />
    <rect x="140" y="0" width="4" height="55" rx="2" />
    <rect x="150" y="16" width="4" height="24" rx="2" />
    <rect x="160" y="8" width="4" height="40" rx="2" />
    <rect x="170" y="18" width="4" height="18" rx="2" />
    <rect x="180" y="2" width="4" height="52" rx="2" />
    <rect x="190" y="12" width="4" height="32" rx="2" />
    <rect x="200" y="20" width="4" height="15" rx="2" />
    <rect x="210" y="6" width="4" height="44" rx="2" />
    <rect x="220" y="14" width="4" height="28" rx="2" />
    <rect x="230" y="22" width="4" height="12" rx="2" />
  </g>

  <!-- Stars Line -->
  <text x="300" y="525" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2.5" opacity="0.9">RANBIR KAPOOR • DEEPIKA PADUKONE</text>

  <!-- Singers / Composer Credits -->
  <text x="300" y="560" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#fb923c" text-anchor="middle" letter-spacing="1.5">TOCHI RAINA • REKHA BHARDWAJ • PRITAM</text>

  <!-- Honor Badge Pill -->
  <rect x="110" y="605" width="380" height="32" rx="16" fill="#000000" fill-opacity="0.8" stroke="#f97316" stroke-opacity="0.5" stroke-width="1.5" />
  <text x="300" y="626" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#f97316" text-anchor="middle" letter-spacing="2">★ ALL-TIME SUFI CLASSIC ★</text>

  <!-- Bottom Script Indicators -->
  <line x1="80" y1="675" x2="520" y2="675" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
  <text x="140" y="705" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#a8a29e" text-anchor="middle">हिन्दी देवनागरी</text>
  <text x="300" y="705" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#a8a29e" text-anchor="middle">ROMAN ENGLISH</text>
  <text x="460" y="705" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#a8a29e" text-anchor="middle">LYRICS SYNCED</text>

  <!-- Bottom Brand -->
  <text x="300" y="740" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#78716c" text-anchor="middle" letter-spacing="3">AAPAN AI • INDIC KARAOKE STUDIO</text>
</svg>